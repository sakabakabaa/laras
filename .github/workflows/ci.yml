name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint changed TypeScript
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run lint:changed -- "$CI_BASE_SHA"
      - name: Check types
        run: npm run typecheck --workspace web
      - name: Run all unit and render tests
        run: npm test --workspace web
      - name: Build production app
        run: npm run build --workspace web

  pocketbase:
    name: PocketBase integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test isolated PocketBase workflow
        env:
          PB_TEST_BINARY: ${{ github.workspace }}/apps/pocketbase/pocketbase
        run: |
          chmod +x "$PB_TEST_BINARY"
          node apps/web/scripts/test-scheduled-classes.mjs

  gate:
    name: CI
    if: always()
    needs: [web, pocketbase]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both check suites to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          POCKETBASE_RESULT: ${{ needs.pocketbase.result }}
        run: |
          test "$WEB_RESULT" = success
          test "$POCKETBASE_RESULT" = success
