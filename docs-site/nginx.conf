# LARAS docs — served under https://laraslernen.com/docs (Traefik strips nothing;
# the /docs prefix is part of the Docusaurus baseUrl).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # Docusaurus emits the localized 404 page too; unknown /docs/id/ paths
    # fall back to it, everything else to the English one.
    location = /404.html { internal; }

    location = / {
        return 301 /docs/;
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        rewrite ^/docs/(.*)$ /$1 break;
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Localized (id) unknown URLs -> localized 404 page.
    location ^~ /docs/id/ {
        rewrite ^/docs/(.*)$ /$1 break;
        try_files $uri $uri.html $uri/index.html $uri/ /id/404.html;
    }

    location / {
        return 404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
